name: PR Promotion Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - integration
      - lab
      - laboratory
      - release
      - main

jobs:
  validate_promotion_path:
    name: Validate PR promotion path
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check source -> target branch flow
        id: check
        shell: bash
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "Base branch: $BASE"
          echo "Head branch: $HEAD"

          ALLOWED=false

          # work branch -> integration
          if [[ "$BASE" == "integration" ]] && [[ "$HEAD" != "integration" && "$HEAD" != "lab" && "$HEAD" != "laboratory" && "$HEAD" != "release" && "$HEAD" != "main" ]]; then
            ALLOWED=true
          fi

          # integration -> lab / laboratory
          if [[ "$BASE" == "lab" || "$BASE" == "laboratory" ]] && [[ "$HEAD" == "integration" ]]; then
            ALLOWED=true
          fi

          # lab / laboratory -> release
          if [[ "$BASE" == "release" ]] && [[ "$HEAD" == "lab" || "$HEAD" == "laboratory" ]]; then
            ALLOWED=true
          fi

          # release -> main
          if [[ "$BASE" == "main" ]] && [[ "$HEAD" == "release" ]]; then
            ALLOWED=true
          fi

          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"

          if [[ "$ALLOWED" != "true" ]]; then
            echo "Invalid PR flow: '$HEAD' -> '$BASE'."
            echo "Allowed flows are:"
            echo "  - work branch -> integration"
            echo "  - integration -> lab (or laboratory)"
            echo "  - lab (or laboratory) -> release"
            echo "  - release -> main"
            exit 1
          fi

  backend_checks:
    name: Backend checks (lint, test, build)
    runs-on: ubuntu-latest
    needs: validate_promotion_path
    if: needs.validate_promotion_path.outputs.allowed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
